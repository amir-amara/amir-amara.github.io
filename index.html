<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرض مشاريعي</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 40px; background: #f8fafc; text-align: center; }
    .card-container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); width: 250px; text-decoration: none; color: #1e293b; font-weight: bold; border: 1px solid #e2e8f0; }
    .card:hover { transform: translateY(-3px); border-color: #3b82f6; }
  </style>
</head>
<body>
  <h1>أهلاً بك في منصتي الرقمية</h1>
  <p>اختر أحد التطبيقات لتجربتها مباشرة:</p>

  <div class="card-container">
    <!-- سنقوم بربط المشاريع هنا لاحقاً -->
    <a href="/bio-lab/" class="card">🧪 مختبر البيولوجيا التفاعلي</a>
  </div>
</body>
</html>
