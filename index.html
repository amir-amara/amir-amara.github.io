<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة الأستاذ أمير أمارة</title>
<meta name="description" content="منصة مواد البيوتكنولوجيا – مدرسة ابن رشد الثانوية، كفر كنا">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7f6; --surface:#ffffff; --ink:#14231f; --muted:#5b6b66; --line:#dfe7e4;
  --brand:#0f766e; --brand-ink:#ffffff; --brand-soft:#e3f3f0;
  --lock:#9a3412; --lock-soft:#fdf0e7; --ok:#15803d; --ok-soft:#e6f4ea;
  --shadow:0 1px 2px rgb(16 40 34 / .06), 0 8px 24px -12px rgb(16 40 34 / .18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1513; --surface:#15211e; --ink:#e7efec; --muted:#9db0aa; --line:#25352f;
    --brand:#2dd4bf; --brand-ink:#062420; --brand-soft:#123430;
    --lock:#fdba74; --lock-soft:#2e1d12; --ok:#4ade80; --ok-soft:#12291b;
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 10px 30px -14px rgb(0 0 0 / .6);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1513; --surface:#15211e; --ink:#e7efec; --muted:#9db0aa; --line:#25352f;
  --brand:#2dd4bf; --brand-ink:#062420; --brand-soft:#123430;
  --lock:#fdba74; --lock-soft:#2e1d12; --ok:#4ade80; --ok-soft:#12291b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif; line-height:1.6;
  min-height:100vh;
}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
header{
  position:relative; overflow:hidden;
  background:linear-gradient(135deg,#0b4f49 0%,#0f766e 55%,#14917f 100%);
  color:#fff; padding:56px 0 72px;
}
header svg.helix{position:absolute;inset-inline-start:-40px;top:-10px;opacity:.14;width:420px;height:auto;pointer-events:none}
.eyebrow{display:inline-block;font-size:.85rem;font-weight:600;letter-spacing:.02em;
  background:rgb(255 255 255 / .14);padding:4px 12px;border-radius:999px;margin-bottom:14px}
h1{font-size:clamp(1.7rem,4.5vw,2.6rem);margin:0 0 6px;font-weight:700;line-height:1.25}
header p{margin:0;opacity:.88;font-size:1.05rem}

/* ---------- sections ---------- */
main{margin-top:-40px;padding-bottom:48px}
.section-title{display:flex;align-items:center;gap:10px;margin:36px 0 14px;font-size:1.1rem;font-weight:700}
.section-title .count{font-size:.8rem;font-weight:600;color:var(--muted);background:var(--surface);
  border:1px solid var(--line);padding:1px 10px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;
  transition:transform .18s ease,border-color .18s ease;
}
.card:hover{transform:translateY(-3px);border-color:var(--brand)}
.card-head{display:flex;align-items:flex-start;gap:14px}
.icon{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;
  font-size:1.5rem;background:var(--brand-soft)}
.card h3{margin:0;font-size:1.1rem;line-height:1.35}
.repo{font-family:ui-monospace,Menlo,monospace;font-size:.78rem;color:var(--muted);direction:ltr;text-align:right}
.card p{margin:0;color:var(--muted);font-size:.95rem;flex:1}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:.75rem;font-weight:600;padding:2px 10px;border-radius:999px}
.badge.public{background:var(--ok-soft);color:var(--ok)}
.badge.private{background:var(--lock-soft);color:var(--lock)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;font-size:.92rem;
  padding:9px 16px;border-radius:10px;border:1px solid var(--line);color:var(--ink);background:transparent;
  cursor:pointer;font-family:inherit;
}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.08);color:var(--brand-ink)}
.btn[hidden]{display:none}
.card{position:relative;cursor:pointer}
.card h3 a.stretch{color:inherit;text-decoration:none}
.card h3 a.stretch::after{content:"";position:absolute;inset:0;border-radius:16px}
.card h3 a.stretch:focus-visible::after{outline:2px solid var(--brand);outline-offset:2px}
.go{font-weight:600;font-size:.92rem;color:var(--brand)}
.gh{position:relative;z-index:1;align-self:flex-start;font-size:.8rem;font-weight:600;color:var(--muted);
  text-decoration:none;border:1px dashed var(--line);border-radius:8px;padding:4px 10px}
.gh span{font-family:ui-monospace,Menlo,monospace;font-weight:400;direction:ltr;display:inline-block}
.gh:hover{color:var(--brand);border-color:var(--brand)}

footer{border-top:1px solid var(--line);padding:22px 0 30px;color:var(--muted);font-size:.88rem;text-align:center}
@media (max-width:520px){ header{padding:40px 0 64px} .card{padding:18px} }
</style>
</head>
<body>

<header>
  <svg class="helix" viewBox="0 0 200 400" fill="none" stroke="#fff" stroke-width="3" aria-hidden="true">
    <path d="M40 0 C160 50 160 100 40 150 C-80 200 160 250 40 300 C-80 350 160 400 40 450"/>
    <path d="M160 0 C40 50 40 100 160 150 C280 200 40 250 160 300 C280 350 40 400 160 450"/>
    <g stroke-width="2"><line x1="60" y1="25" x2="140" y2="25"/><line x1="70" y1="75" x2="130" y2="75"/>
    <line x1="60" y1="125" x2="140" y2="125"/><line x1="60" y1="175" x2="140" y2="175"/>
    <line x1="70" y1="225" x2="130" y2="225"/><line x1="60" y1="275" x2="140" y2="275"/>
    <line x1="60" y1="325" x2="140" y2="325"/><line x1="70" y1="375" x2="130" y2="375"/></g>
  </svg>
  <div class="wrap">
    <span class="eyebrow">🧬 بيوتكنولوجيا · 5 وحدات</span>
    <h1>منصة الأستاذ أمير أمارة</h1>
    <p>مدرسة ابن رشد الثانوية – كفر كنا · أوراق عمل، صفحات تفاعلية ومشاريع للطلاب</p>
  </div>
</header>

<main class="wrap">

  <div class="section-title">📚 مواد الطلاب <span class="count" id="pub-count"></span></div>
  <div class="grid" id="public-grid"></div>


</main>

<footer>إعداد الأستاذ أمير أمارة · مدرسة ابن رشد الثانوية – كفر كنا</footer>

<script src="repos.js"></script>
<script>
/* الإعدادات وقوائم المستودعات موجودة في repos.js */

/* وضع المعلم: افتح الموقع مرة واحدة بـ ?teacher لإظهار روابط GitHub، و ?student لإخفائها */
let TEACHER = false;
try{
  const q = new URLSearchParams(location.search);
  if (q.has("teacher")) localStorage.setItem("aa_teacher","1");
  if (q.has("student")) localStorage.removeItem("aa_teacher");
  TEACHER = localStorage.getItem("aa_teacher") === "1";
  if (q.has("teacher") || q.has("student")) history.replaceState(null, "", location.pathname);
}catch(e){}

/* ================= بناء البطاقات ================= */
const gh = r => `https://github.com/${CONFIG.owner}/${r}`;
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function card(r){
  return `
  <article class="card">
    <div class="card-head">
      <div class="icon">${r.icon}</div>
      <h3><a class="stretch" href="repo.html?r=${r.repo}">${esc(r.title)}</a></h3>
    </div>
    <p>${esc(r.desc)}</p>
    <div class="go">عرض المحتوى ←</div>
    ${TEACHER ? `<a class="gh" href="${gh(r.repo)}" target="_blank" rel="noopener">GitHub ↗</a>` : ""}
  </article>`;
}

document.getElementById("public-grid").innerHTML = PUBLIC_REPOS.map(card).join("");
document.getElementById("pub-count").textContent = PUBLIC_REPOS.length;

</script>
</body>
</html>
